<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品只读采集器 · 连哪个服务</title>
  <style>
    :root { color-scheme: light dark; --text: #1f2328; --muted: #59636e; --line: #d1d9e0; --surface: #ffffff; --accent: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --text: #e6edf3; --muted: #9198a1; --line: #3d444d; --surface: #0d1117; --accent: #4493f8; } }
    body { margin: 0; background: var(--surface); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    section { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; }
    section p { margin: 4px 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { box-sizing: border-box; width: 100%; padding: 8px 10px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    button[type="submit"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
    #message { min-height: 1.6em; margin-top: 16px; }
    .note { color: var(--muted); font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>这个插件替哪个工作台干活</h1>
    <section aria-live="polite">
      <p id="address">正在问插件后台……</p>
      <p id="connection"></p>
      <p id="computer"></p>
    </section>
    <form id="central">
      <label for="service-address">团队服务的网址</label>
      <input id="service-address" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="200"
        placeholder="https://你们的域名">
      <div class="actions">
        <button id="connect" type="submit">连上这个网址</button>
        <button id="local" type="button">改回这台电脑上的工作台</button>
      </div>
    </form>
    <p id="message" role="status"></p>
    <p class="note">只填你们团队自己的服务网址。点「连上这个网址」后 Chrome 会问能不能让插件访问这个网址，选「允许」。
      主人自己的 Mac 用这台电脑上的工作台，不用改。</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
