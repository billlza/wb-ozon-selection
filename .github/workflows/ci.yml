name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Static checks and pure tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      SELECTION_REVIEW_AUTO_DELIVER: "off"
      SELECTION_REVIEW_CODEX_DISPATCH: "off"
    defaults:
      run:
        working-directory: selection-review-app

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          working-directory: selection-review-app
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: selection-review-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check JavaScript syntax
        env:
          NODE_OPTIONS: "--throw-deprecation"
        run: >-
          find . -type f \( -name '*.js' -o -name '*.mjs' \)
          -not -path './node_modules/*' -print0
          | xargs -0 -n 1 node --check

      - name: Run self-contained tests without API processes
        env:
          NODE_OPTIONS: "--throw-deprecation"
        run: pnpm test:ci

      - name: Build application
        env:
          NODE_OPTIONS: "--throw-deprecation"
        run: pnpm build

      - name: Check server entrypoint syntax
        env:
          NODE_OPTIONS: "--throw-deprecation"
        run: node --check server.mjs

  api:
    name: Isolated API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: selection-review-app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          working-directory: selection-review-app
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: selection-review-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Prepare official Node.js test image
        run: docker pull node:24-bookworm-slim

      - name: Build assets for runtime package validation
        env:
          NODE_OPTIONS: "--throw-deprecation"
        run: pnpm build

      - name: Run API tests with loopback-only networking and no host credentials
        run: |
          docker run --rm --init --network none --user node \
            --cap-drop ALL --security-opt no-new-privileges \
            --read-only --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --tmpfs /home/node:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=16m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/selection-review-app,target=/workspace/selection-review-app,readonly" \
            --workdir /workspace/selection-review-app \
            --entrypoint /usr/bin/env node:24-bookworm-slim -i \
            PATH=/usr/local/bin:/usr/bin:/bin CI=true GITHUB_ACTIONS=true \
            CI_API_TESTS=isolated-container NODE_OPTIONS=--throw-deprecation \
            SELECTION_REVIEW_AUTO_DELIVER=off SELECTION_REVIEW_CODEX_DISPATCH=off \
            node scripts/run-ci-api-tests.mjs
